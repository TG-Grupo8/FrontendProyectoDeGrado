services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: medplants-frontend
    ports:
      - "5173:80"
    networks:
      - medplants
    restart: unless-stopped

networks:
  medplants:
    name: medplants-network
    external: true
